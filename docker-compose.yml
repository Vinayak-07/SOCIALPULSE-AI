version: '3.8'
services:
  postgres:
    image: ankane/pgvector
    environment: {POSTGRES_USER:postgres,POSTGRES_PASSWORD:postgres,POSTGRES_DB:socialpulse}
    ports: ["5432:5432"]
    healthcheck: {test:["CMD-SHELL","pg_isready -U postgres"],interval:5s}
  backend:
    build: .
    ports: ["8000:8000"]
    environment: {DATABASE_URL:postgresql://postgres:postgres@postgres:5432/socialpulse}
    depends_on: {postgres:{condition:service_healthy}}
  dashboard:
    build: .
    ports: ["8501:8501"]
    command: streamlit run dashboard/app.py --server.port 8501
